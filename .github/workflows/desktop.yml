name: Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'core/model/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', 'core/model/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # only used to attach installers to a release when a desktop-v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # No wrapper is committed yet; after `gradle wrapper` is committed, switch these steps to .\gradlew.bat.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Tests (shared model and desktop)
        run: gradle :core:model:test :desktop:test --console=plain
      - name: Installers (MSI and EXE)
        run: gradle :desktop:packageMsi :desktop:packageExe --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: KingPlay-windows-installers
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-reports
          path: |
            desktop/build/reports/
            desktop/build/test-results/
            core/model/build/reports/
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
          generate_release_notes: true
