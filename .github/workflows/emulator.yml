name: Emulator smoke
on:
  workflow_dispatch:
  push:
    paths: ['app/src/androidTest/**', '.github/workflows/emulator.yml', '.github/scripts/emu.sh']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/emu.sh
      - name: Publish screenshots
        if: always()
        run: |
          [ -d shots ] && [ -n "$(ls -A shots 2>/dev/null)" ] || exit 0
          rm -rf /tmp/shots && mkdir /tmp/shots && cp shots/* /tmp/shots/
          cd /tmp/shots && git init -q && git checkout -q -b ci-screenshots
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
