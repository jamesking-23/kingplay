name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The repo ships no wrapper yet; this installs Gradle itself. After `gradle wrapper` is committed, use ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Static analysis (report only for now)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle detekt lint -PwarningsAsErrors=true 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -nE "^e: |What went wrong|Could not |Unresolved|FAILED|error:" -A12 build.log | head -90 > errs.txt
            [ -s errs.txt ] || tail -60 build.log > errs.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errs.txt | cut -c1-7000)
            echo "::error title=Gradle output::$msg"
          fi
          exit $code
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Assemble
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
